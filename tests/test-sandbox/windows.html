<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Window & Dialog Test Hub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 6px 4px;
      font-weight: 500;
    }
    button:hover { background: #0369a1; }
    .badge {
      margin-top: 16px;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="window-title">Browser Switching & Dialogs Hub</h2>
    <p>Practice window handling, multiple tabs, alerts, and confirmations.</p>

    <div>
      <a id="link-new-tab" href="about:blank" target="_blank" onclick="this.href=window.location.href + '?tab=child'">
        <button type="button">Open New Tab</button>
      </a>
      <button id="btn-popup" onclick="openPopup()">Open Popup Window</button>
    </div>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

    <div>
      <button id="btn-alert" onclick="triggerAlert()">Trigger Alert</button>
      <button id="btn-confirm" onclick="triggerConfirm()">Trigger Confirm</button>
      <button id="btn-prompt" onclick="triggerPrompt()">Trigger Prompt</button>
    </div>

    <div id="dialog-result" class="badge">Awaiting Dialog Action...</div>
  </div>

  <script>
    function openPopup() {
      window.open(window.location.href + '?popup=1', 'SubWindow', 'width=500,height=400');
    }
    function triggerAlert() {
      alert('Enterprise Playwright Alert Message!');
      document.getElementById('dialog-result').innerText = 'Alert was acknowledged';
    }
    function triggerConfirm() {
      const response = confirm('Do you confirm this action?');
      document.getElementById('dialog-result').innerText = 'Confirm result: ' + (response ? 'Accepted' : 'Dismissed');
    }
    function triggerPrompt() {
      const input = prompt('Please enter your department name:', 'Quality Engineering');
      document.getElementById('dialog-result').innerText = 'Prompt entered: ' + input;
    }
  </script>
</body>
</html>
